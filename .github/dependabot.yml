version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupa as atualizações de patch/minor num PR só, para não abrir uma
      # dezena de PRs por semana num projeto de uma pessoa.
      menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
