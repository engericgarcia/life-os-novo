<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>life-os</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #ffffff;
        color: #1a1110;
        font-family: ui-sans-serif, -apple-system, Roboto, sans-serif;
        text-align: center;
      }
      .marca {
        width: 56px; height: 56px;
        margin: 0 auto 1.5rem;
        border-radius: 14px;
        background: #dc402b;
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0; color: #6b625f; font-size: .9rem; line-height: 1.5; max-width: 22rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">
        <svg width="30" height="30" viewBox="0 0 512 512" aria-hidden="true">
          <circle cx="256" cy="256" r="140" fill="none" stroke="#fff" stroke-width="62"
                  stroke-linecap="round" stroke-dasharray="660 880"
                  transform="rotate(-90 256 256)" />
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>
        O life-os precisa de internet para carregar suas tarefas e hábitos.
        Verifique a conexão e abra o app novamente.
      </p>
    </main>
  </body>
</html>
